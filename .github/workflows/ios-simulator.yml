# On-demand iPad rendering check.
#
# App Review rejected 0.2.12 under guideline 4.0 ("hard to read type"), with a
# screenshot of the app on an iPad rendering washed out — near-white surfaces
# under light-grey text, nothing like the dark theme a fresh install uses. That
# reproduces on neither Android nor Linux desktop from the same Dart, and no
# self-hosted runner can build iOS (all four are Linux/X64), so this job exists
# to get eyes on the actual iOS pixels.
#
# Simulator builds need no signing, so unlike the release job this needs no
# secrets and no App Store Connect access.
#
# It is workflow_dispatch only: nothing here gates a push.
name: iOS simulator screenshots

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator device name substring (e.g. "iPad Air", "iPad Pro", "iPhone")'
        required: false
        # Apple's rejection screenshot is 1640x2360, the native resolution of
        # the 11-inch iPad Air — so that is the reviewer's device, and matching
        # it gives the best chance of reproducing what they saw. Widen to "iPad"
        # (picks the largest available) or "iPhone" to check other form factors.
        default: 'iPad Air'

env:
  # Keep in sync with ci.yml / release.yml / .fvmrc.
  FLUTTER_CHANNEL: beta
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  screenshots:
    name: iPad screenshots
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest stable Xcode
        # Deliberately the same selection the release job makes, so the SDK this
        # builds against matches the SDK the rejected binary was built against.
        # That equivalence is the whole point — see the "Record the SDK" step.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache pub + native deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          n=0; max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            sleep $((n * 15))
          done

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build for the simulator
        # --simulator produces an arm64 .app with no code signing at all, which
        # is why this job needs none of the release job's certificates.
        #
        # Try release first: the rejected binary was a release build, and debug
        # differs in ways that could matter to a rendering fault (JIT vs AOT,
        # the debug banner, shader warm-up). Flutter has historically refused
        # release/profile for the simulator, so fall back rather than fail, and
        # record which mode actually produced the .app — a screenshot from a
        # debug build is weaker evidence and the summary should say so.
        shell: bash
        run: |
          set -uo pipefail
          for mode in release profile debug; do
            echo "::group::flutter build ios --simulator --$mode"
            if flutter build ios --simulator --no-codesign "--$mode" -v; then
              echo "::endgroup::"
              echo "BUILD_MODE=$mode" >> "$GITHUB_ENV"
              echo "Built in $mode mode" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            echo "$mode mode not supported for the simulator, trying next"
          done
          echo "::error::no build mode succeeded for the simulator" >&2
          exit 1

      - name: Record the SDK the binary was built against
        # The leading hypothesis for the washed-out rendering is that building
        # against the iOS 26 SDK opts the app into the system's new design
        # language, and the app has no UIDesignRequiresCompatibility key to
        # decline it. These three keys say which SDK actually got used, which
        # either supports that or kills it outright.
        shell: bash
        run: |
          APP=build/ios/iphonesimulator/Runner.app
          PLIST="$APP/Info.plist"
          echo "### Built-against SDK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for key in DTSDKName DTPlatformVersion DTXcode DTXcodeBuild MinimumOSVersion UIDesignRequiresCompatibility; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" 2>/dev/null || echo '(absent)')
            printf '%-32s %s\n' "$key" "$value" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version

      - name: Boot the simulator
        id: sim
        shell: bash
        env:
          DEVICE_FILTER: ${{ inputs.device }}
        run: |
          set -euo pipefail
          # Pick the best matching available device rather than hardcoding a
          # name: the runner image's simulator list changes with every Xcode.
          # Prefer a "Pro", then the longest name (13-inch sorts over 11-inch).
          cat > "$RUNNER_TEMP/pick_sim.py" <<'PY'
          import json, os, re, subprocess, sys

          want = (os.environ.get("DEVICE_FILTER") or "iPad").strip().lower()
          data = json.loads(
              subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  capture_output=True, text=True, check=True,
              ).stdout
          )

          def rank(name):
              # Screen size first, read out of the name ("13-inch" > "11-inch").
              # Ranking on len(name) instead does NOT work: "iPad Pro 11-inch
              # (M4)" and "iPad Pro 13-inch (M4)" are both 21 characters, so the
              # winner would come down to dict order and drift between Xcode
              # releases. Fall back to the name so ties stay deterministic.
              inches = re.search(r"(\d+(?:\.\d+)?)-inch", name)
              return (
                  float(inches.group(1)) if inches else 0.0,
                  "pro" in name.lower(),
                  name,
              )

          best = None
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if want not in d["name"].lower():
                      continue
                  r = rank(d["name"])
                  if best is None or r > best[0]:
                      best = (r, d["udid"], d["name"])
          if best is None:
              sys.exit("no available iOS simulator matching %r" % want)
          print("%s\t%s" % (best[1], best[2]))
          PY
          row=$(python3 "$RUNNER_TEMP/pick_sim.py") || {
            echo "::error::simulator selection failed" >&2
            xcrun simctl list devices available
            exit 1
          }
          udid=${row%%$'\t'*}
          name=${row#*$'\t'}
          echo "Booting $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Install and capture
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP=build/ios/iphonesimulator/Runner.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Bundle id: $BUNDLE_ID  (build mode: ${BUILD_MODE:-unknown})"
          xcrun simctl install "$UDID" "$APP"

          # A venv, not a bare `pip install`: the runner's python3 is Homebrew's
          # and is PEP 668 externally-managed, so a plain install exits with
          # "externally-managed-environment".
          python3 -m venv "$RUNNER_TEMP/venv"
          PY_BIN="$RUNNER_TEMP/venv/bin/python"
          "$PY_BIN" -m pip install --quiet --disable-pip-version-check Pillow numpy

          # NB: not named inspect.py — it sits first on sys.path for its own
          # run, and numpy imports the stdlib `inspect` internally, so that
          # name shadows it and numpy dies on a circular import.
          #
          # Classifies a screenshot by sampling three strips the centred system
          # alert can never reach. A rendered dark theme reads ~33; the white
          # launch screen reads ~204 once the alert dims it. Crucially it also
          # reports uniformity: a blank screen is *perfectly* flat (std 0.0),
          # which is what distinguishes "not drawn yet" from "drawn wrong".
          #
          # An earlier version of this job waited for the screenshot to stop
          # changing instead, and was fooled every time — a launch screen that
          # has not drawn is already static, so it "settled" in nine seconds and
          # captured nothing. Uniformity is the signal that actually works.
          cat > "$RUNNER_TEMP/shot_stats.py" <<'PY'
          import sys
          import numpy as np
          from PIL import Image

          a = np.asarray(Image.open(sys.argv[1]).convert("RGB")).astype(float)
          h, w, _ = a.shape
          strips = [
              a[int(h * 0.05):int(h * 0.18), :, :],
              a[int(h * 0.80):int(h * 0.95), :, :],
              a[int(h * 0.20):int(h * 0.80), 0:int(w * 0.12), :],
          ]
          mean = float(np.mean([s.mean() for s in strips]))
          std = float(max(s.std() for s in strips))
          # Rendered UI always varies across a strip that wide; a flat fill does
          # not. Measured on real captures from run 32653193441: undrawn screens
          # come back at exactly 0.00 (PNG is lossless, so flat really is flat)
          # and the drawn dark theme at 1.63. 0.5 sits ~3x clear of both.
          drawn = std > 0.5
          print("%.1f %.2f %s" % (mean, std, "drawn" if drawn else "blank"))
          PY

          shot() { xcrun simctl io "$UDID" screenshot --type=png "$1" >/dev/null 2>&1; }

          # Block until the app has actually put pixels on screen.
          wait_drawn() {
            local out=$1 i
            for i in $(seq 1 40); do
              sleep 3
              shot "$out" || continue
              read -r mean std state <<<"$("$PY_BIN" "$RUNNER_TEMP/shot_stats.py" "$out")"
              if [ "$state" = "drawn" ]; then
                sleep 3   # let the first frame finish settling
                shot "$out"
                return 0
              fi
            done
            echo "::error::app never rendered within 120s (screen stayed flat) — that is itself the finding" >&2
            return 1
          }

          report() {
            read -r mean std state <<<"$("$PY_BIN" "$RUNNER_TEMP/shot_stats.py" "artifacts/$1.png")"
            printf '| %s | %s | %s | %s |\n' "$1" "$mean" "$std" "$state" >> "$GITHUB_STEP_SUMMARY"
            echo "captured $1  mean=$mean std=$std $state"
          }

          {
            echo "### Screenshot analysis"
            echo
            echo "Strips the system alert cannot reach. Dark theme reads ~33; an"
            echo "undrawn white launch screen reads ~204 with std 0.00."
            echo
            echo "| capture | mean | std | state |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          wait_drawn artifacts/01-default.png
          report 01-default

          # No relaunch between the variants below. Flutter observes trait
          # changes live, and terminating the app just reintroduces the
          # launch-screen race that produced six useless screenshots.
          variant() {
            sleep 4
            shot "artifacts/$1.png"
            report "$1"
          }

          xcrun simctl ui "$UDID" appearance light  && variant 02-appearance-light
          xcrun simctl ui "$UDID" appearance dark   && variant 03-appearance-dark
          xcrun simctl ui "$UDID" appearance light

          # `content_size`, underscore — `content-size` is not a simctl option
          # and exits 117, which killed an earlier run after three captures.
          for size in large extra-extra-extra-large accessibility-extra-large; do
            xcrun simctl ui "$UDID" content_size "$size"
            variant "04-text-$size"
          done
          xcrun simctl ui "$UDID" content_size large

      - name: Collect app log
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "$UDID" log show --last 10m \
            --predicate 'processImagePath CONTAINS "Runner"' \
            > artifacts/app.log 2>&1 || true
          tail -n 40 artifacts/app.log || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots-${{ steps.sim.outputs.name || 'unknown' }}
          path: artifacts/
          if-no-files-found: error

      - name: Shut down the simulator
        if: always()
        run: xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
