name: SimplySign probe (Windows)

# Companion to simplysign-probe.yml, and the more promising of the two now.
#
# The Linux route got a session open headlessly but dead-ends at signing:
# Certum's Linux PKCS#11 module segfaults on object enumeration, in
# pkcs11-tool, p11tool and osslsigncode 2.2 and 2.9 alike. Windows needs no
# enumeration at all - the cert lands in Cert:\CurrentUser\My and signtool
# signs by thumbprint.
#
# v0.2.10-rc.2 gave up on Windows after "No SimplySign window could be
# activated in 60s". Linux then showed what that actually means: SimplySign is
# a TRAY app that starts windowless, and its login is behind the tray icon. So
# the Windows conclusion ("hosted runners have no desktop") may have been
# wrong - the window was probably just never asked for. This probe finds out:
# it enumerates every top-level window of the process rather than trusting
# MainWindowHandle, tries a second launch to raise the existing instance
# (the app has an "Application already running" path), and screenshots the
# desktop so there is evidence either way.
on:
  workflow_dispatch:
  push:
    branches: [ci/self-hosted-runners]
    paths:
      - .github/workflows/simplysign-probe-windows.yml

jobs:
  probe:
    name: Probe SimplySign on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SimplySign Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.4.92/SimplySignDesktop-9.4.4.92-64-bit-en.msi'
          $sha = '8EC420FC27798B86078B7BD02FE7152097E1B3005BAB51820EACA8E57DF84DA3'
          $msi = "$env:TEMP\SimplySignDesktop.msi"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne $sha) { throw "hash mismatch: $actual" }
          Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait
          Get-ChildItem 'C:\Program Files\Certum' -Recurse -Filter '*.exe' |
            Select-Object -First 10 FullName

      - name: Can this runner see a desktop at all?
        shell: pwsh
        # The premise of the rc.2 conclusion, tested directly rather than
        # inferred from one app's silence.
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          "Interactive session : $([Environment]::UserInteractive)"
          "Session id          : $((Get-Process -Id $PID).SessionId)"
          "Window station      : $([System.Windows.Forms.SystemInformation]::UserName)"
          try {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            "Virtual screen      : $($b.Width)x$($b.Height)"
          } catch { "Virtual screen      : unavailable - $($_.Exception.Message)" }
          "explorer running    : $([bool](Get-Process explorer -ErrorAction SilentlyContinue))"

      - name: Open a SimplySign session with the real login script
        # Windows PowerShell, not pwsh: the helpers reference .NET Framework
        # assemblies that pwsh 7 cannot resolve.
        shell: powershell
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: .\dist\simplysign-login.ps1

      - name: Did a certificate arrive?
        shell: powershell
        run: |
          "WINDOWS_CERT_SHA1 = $env:WINDOWS_CERT_SHA1"
          Get-ChildItem Cert:\CurrentUser\My | Format-List Subject, Thumbprint, NotAfter

      - name: Screenshot the desktop
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          try {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\desktop.png")   # not $env:TEMP: the upload path is runner.temp, and on this image they differ
            "Captured $($b.Width)x$($b.Height)"
          } catch {
            "::warning::Screen capture failed: $($_.Exception.Message)"
          }

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplysign-windows-desktop
          path: |
            ${{ runner.temp }}/desktop.png
            ${{ runner.temp }}/simplysign-window.png
            ${{ runner.temp }}/simplysign-failure.png
          if-no-files-found: warn
