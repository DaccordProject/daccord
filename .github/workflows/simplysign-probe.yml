name: SimplySign probe

# A throwaway diagnostic, not part of any release. It answers one question:
# can a self-hosted Linux runner open a Certum SimplySign session under Xvfb
# and expose the cloud key as a PKCS#11 token?
#
# The GitHub-hosted Windows runner cannot (v0.2.10-rc.2: "No SimplySign window
# could be activated in 60s" - no interactive desktop). If this probe goes
# green, the release pipeline moves Windows Authenticode signing to Linux via
# osslsigncode; if it goes red, the answer is a self-hosted Windows runner with
# an autologon session, and this file gets deleted either way.
#
# Triggering is deliberately narrow: it holds a signing session open, so it
# must not fire on ordinary pushes. workflow_dispatch alone would be ideal, but
# GitHub only registers dispatchable workflows from the DEFAULT branch, and
# this file only exists on ci/self-hosted-runners - so it is unreachable that
# way until merged. Hence the push trigger, pinned to this branch and to the
# two files the probe consists of.
on:
  workflow_dispatch:
  push:
    branches: [ci/self-hosted-runners]
    paths:
      - .github/workflows/simplysign-probe.yml
      - dist/simplysign-login-linux.sh

jobs:
  probe:
    name: Probe SimplySign on Linux
    # The flutter runners are Ubuntu 20.04 (glibc 2.31) and SimplySign 2.9.14
    # needs GLIBC_2.34, so it cannot start there at all. Rather than pin an
    # older SimplySign against Certum's live service, run the job inside a
    # 22.04 container.
    #
    # It runs on the flutter runners even though it needs none of Flutter: the
    # docker-labelled runners are in the Default runner group, which has
    # allows_public_repositories=false, so a job targeting them from this
    # (public) repo queues forever rather than failing. Only the
    # daccord-flutter group is visible here.
    runs-on: [self-hosted, flutter]
    container:
      image: ubuntu:22.04
      # SimplySign talks to its PKCS#11 front end over localhost inside the
      # container; nothing needs to escape it.
      options: --shm-size=1g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          $SUDO apt-get update -qq
          # xvfb: the X server the Qt app needs. xdotool: types into it.
          # opensc: pkcs11-tool, to prove the token is really there.
          # osslsigncode: what will actually sign the PE files.
          # SimplySign Desktop bundles its own Qt, but not Qt's own
          # dependencies — the first probe died on a missing libxslt.so.1. The
          # rest are the usual transitive set for a Qt5 XCB app running against
          # a bare Xvfb (no desktop session, so nothing else pulls them in).
          $SUDO apt-get install -y -qq --no-install-recommends \
            xvfb xdotool opensc osslsigncode curl python3 ca-certificates \
            libxslt1.1 libxml2 libgl1 libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-sync1 libxcb-xfixes0 libnss3 libnspr4 \
            libasound2 libdbus-1-3 libglib2.0-0 libpng16-16 libjpeg-turbo8 \
            libpulse0 libpulse-mainloop-glib0 libxcomposite1 libxrender1
          osslsigncode --version | head -2 || true

      - name: Open SimplySign session
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: ./dist/simplysign-login-linux.sh

      - name: Sign a throwaway PE to prove the key works
        # The real proof is not that a token appeared but that osslsigncode can
        # drive it end to end, timestamp included. Any PE will do, so use one
        # that is already on the runner rather than building Flutter for it.
        run: |
          if [ -z "${SIMPLYSIGN_PKCS11_MODULE:-}" ]; then
            echo "::warning::No session was opened - nothing to sign. See the step above."
            exit 0
          fi
          echo "PKCS#11 module: $SIMPLYSIGN_PKCS11_MODULE"
          pkcs11-tool --module "$SIMPLYSIGN_PKCS11_MODULE" --list-objects | head -30
