name: SimplySign probe

# A throwaway diagnostic, not part of any release. It answers one question:
# can a self-hosted Linux runner open a Certum SimplySign session under Xvfb
# and expose the cloud key as a PKCS#11 token?
#
# The GitHub-hosted Windows runner cannot (v0.2.10-rc.2: "No SimplySign window
# could be activated in 60s" - no interactive desktop). If this probe goes
# green, the release pipeline moves Windows Authenticode signing to Linux via
# osslsigncode; if it goes red, the answer is a self-hosted Windows runner with
# an autologon session, and this file gets deleted either way.
#
# Triggering is deliberately narrow: it holds a signing session open, so it
# must not fire on ordinary pushes. workflow_dispatch alone would be ideal, but
# GitHub only registers dispatchable workflows from the DEFAULT branch, and
# this file only exists on ci/self-hosted-runners - so it is unreachable that
# way until merged. Hence the push trigger, pinned to this branch and to the
# two files the probe consists of.
on:
  workflow_dispatch:
  push:
    branches: [ci/self-hosted-runners]
    paths:
      - .github/workflows/simplysign-probe.yml
      - dist/simplysign-login-linux.sh

jobs:
  probe:
    name: Probe SimplySign on Linux
    # Hosted, not self-hosted. The blocker was never "Linux" — it was Windows,
    # whose runners have no interactive desktop. A hosted Ubuntu runner has a
    # current glibc (the self-hosted ones are 20.04 / glibc 2.31, and
    # SimplySign needs GLIBC_2.34, including in its older builds) and Xvfb
    # installs freely, so it needs no infrastructure at all.
    # Pinned to 22.04, not ubuntu-latest: 24.04 renamed the t64 packages
    # (libasound2 -> libasound2t64 etc), and 22.04's glibc 2.35 already clears
    # SimplySign's GLIBC_2.34 requirement.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo"
          $SUDO apt-get update -qq
          # xvfb: the X server the Qt app needs. xdotool: types into it.
          # opensc: pkcs11-tool, to prove the token is really there.
          # osslsigncode: what will actually sign the PE files.
          # SimplySign Desktop bundles its own Qt, but not Qt's own
          # dependencies — the first probe died on a missing libxslt.so.1. The
          # rest are the usual transitive set for a Qt5 XCB app running against
          # a bare Xvfb (no desktop session, so nothing else pulls them in).
          $SUDO apt-get install -y -qq --no-install-recommends \
            xvfb xdotool openbox stalonetray x11-utils dbus-x11 imagemagick \
            opensc osslsigncode curl python3 ca-certificates \
            libxslt1.1 libxml2 libgl1 libegl1 libfontconfig1 libfreetype6 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-sync1 libxcb-xfixes0 libnss3 libnspr4 \
            libasound2 libdbus-1-3 libglib2.0-0 libpng16-16 libjpeg-turbo8 \
            libpulse0 libpulse-mainloop-glib0 libxcomposite1 libxrender1 \
            libengine-pkcs11-openssl gnutls-bin
          osslsigncode --version | head -2 || true

      - name: Open SimplySign session
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: ./dist/simplysign-login-linux.sh

      - name: Sign a real PE to prove the key works
        # The proof is not that a token appeared but that osslsigncode can
        # drive it end to end, timestamp included. Sign the installer from the
        # last prerelease — a real artifact, not a synthetic file.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${SIMPLYSIGN_PKCS11_MODULE:-}" ]; then
            echo "::warning::No session was opened - nothing to sign. See the step above."
            exit 0
          fi

          # pkcs11-tool --list-objects SEGFAULTS on Certum's module, so use
          # p11tool for enumeration and to export the certificate. Reading the
          # cert off the token beats committing a copy that goes stale at
          # renewal.
          # p11tool printed nothing at all, so before trying to sign, find out
          # what the token actually reports and whether it demands a login.
          echo "--- pkcs11-tool --list-token-slots ---"
          pkcs11-tool --module "$SIMPLYSIGN_PKCS11_MODULE" --list-token-slots 2>&1 | head -20
          echo "--- p11tool --list-tokens ---"
          p11tool --provider "$SIMPLYSIGN_PKCS11_MODULE" --list-tokens 2>&1 | head -20
          echo "--- p11tool --list-all (no login) ---"
          p11tool --provider "$SIMPLYSIGN_PKCS11_MODULE" --list-all 2>&1 | head -30
          echo "--- pkcs11-tool --list-objects --login --pin '' ---"
          pkcs11-tool --module "$SIMPLYSIGN_PKCS11_MODULE" --list-objects --login --pin "" 2>&1 | head -20

          gh release download v0.2.10-rc.2 -R "$GITHUB_REPOSITORY" \
            -p 'daccord-windows-x86_64-setup.exe' -D /tmp || {
              echo "::warning::Could not download the rc.2 installer; skipping the signing test."; exit 0; }

          ENGINE="$(ls /usr/lib/x86_64-linux-gnu/engines-*/pkcs11.so 2>/dev/null | head -1)"
          echo "pkcs11 engine: ${ENGINE:-<none>}"

          # 22.04 ships osslsigncode 2.2, whose PKCS#11 support predates a
          # rewrite; and pkcs11-tool only avoided the segfault when it logged
          # in first. Build 2.9 and give it a PIN, so both differences are
          # tested at once against the module that crashed 2.2.
          sudo apt-get install -y -qq --no-install-recommends \
            cmake build-essential libssl-dev libcurl4-openssl-dev python3-pip >/dev/null
          curl -fsSL -o /tmp/oss.tgz \
            https://github.com/mtrojnar/osslsigncode/archive/refs/tags/2.9.tar.gz
          tar -xzf /tmp/oss.tgz -C /tmp
          cmake -S /tmp/osslsigncode-2.9 -B /tmp/oss-build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/oss-build -j"$(nproc)" >/dev/null
          OSS=/tmp/oss-build/osslsigncode
          "$OSS" --version | head -2

          # The certificate comes from the repo, not the token: enumeration is
          # broken in Certum's module (see dist/certum-codesign.pem). The key
          # never leaves the HSM either way.
          for KEY in \
            "pkcs11:token=Code%20Signing;type=private" \
            "pkcs11:type=private" ; do
            for PASS in "-pass" "" ; do
              echo "=== $OSS  key=$KEY  ${PASS:+with empty PIN}"
              set +e
              if [ -n "$PASS" ]; then
                "$OSS" sign -pkcs11engine "$ENGINE" -pkcs11module "$SIMPLYSIGN_PKCS11_MODULE" \
                  -certs dist/certum-codesign.pem -key "$KEY" -pass "" \
                  -h sha256 -t http://time.certum.pl \
                  -in /tmp/daccord-windows-x86_64-setup.exe -out /tmp/signed-setup.exe >/tmp/oss.log 2>&1
              else
                "$OSS" sign -pkcs11engine "$ENGINE" -pkcs11module "$SIMPLYSIGN_PKCS11_MODULE" \
                  -certs dist/certum-codesign.pem -key "$KEY" \
                  -h sha256 -t http://time.certum.pl \
                  -in /tmp/daccord-windows-x86_64-setup.exe -out /tmp/signed-setup.exe >/tmp/oss.log 2>&1
              fi
              echo "exit=$?"; tail -25 /tmp/oss.log
              set -e
              [ -s /tmp/signed-setup.exe ] && { echo "SIGNED with $KEY"; break 2; }
            done
          done

          [ -s /tmp/signed-setup.exe ] || { echo "::warning::No key URI worked."; exit 0; }

          echo "--- verify ---"
          osslsigncode verify -in /tmp/signed-setup.exe | head -30

      - name: Upload the signed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplysign-signed-exe
          path: /tmp/signed-setup.exe
          if-no-files-found: warn

      - name: Upload screen captures
        # The X11 tree and window titles have both come back empty-handed; the
        # screen itself is the remaining way to see what the app is doing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplysign-screen
          path: /tmp/ssd-shot-*.png
          if-no-files-found: warn
