name: Publish successful release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string
      source_run_id:
        description: Completed tagged Release run that produced the artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified partial release
    runs-on: ubuntu-latest
    env:
      GPG_AVAILABLE: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify source run provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          RUN_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)
          RUN_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_branch)
          RUN_EVENT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .event)
          RUN_STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .status)
          test "$RUN_SHA" = "$TAG_SHA"
          test "$RUN_BRANCH" = "$TAG"
          test "$RUN_EVENT" = "push"
          test "$RUN_STATUS" = "completed"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi
          echo "Verified $TAG at $TAG_SHA against tagged run $SOURCE_RUN_ID."

      - name: Download successful artifacts from source run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          path: artifacts
          pattern: daccord-*
          merge-multiple: true

      - name: Verify the intentionally partial artifact set
        run: |
          set -euo pipefail
          test -f artifacts/daccord-android.apk
          test -f artifacts/app-play-release.aab
          test -f artifacts/daccord-linux-x86_64.deb
          test -f artifacts/daccord-linux-x86_64.tgz
          test -f artifacts/daccord-web.zip
          test ! -e artifacts/daccord-macos-universal.dmg
          test ! -e artifacts/daccord-windows-x86_64-setup.exe
          if find artifacts -maxdepth 1 -type f -name '*.tar.gz' -print -quit | grep -q .; then
            echo "::error::Refusing to publish a .tar.gz asset."
            exit 1
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          mapfile -t files < <(
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS.txt' ! -name '*.asc' -printf '%P\n' | sort
          )
          test "${#files[@]}" -eq 5
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign checksums
        if: env.GPG_AVAILABLE == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          test -n "$KEY"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE:-}" \
            --local-user "$KEY" --armor --detach-sign \
            --output artifacts/checksums.asc artifacts/SHA256SUMS.txt
          gpg --verify artifacts/checksums.asc artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: |
            > **Direct desktop download note:** Windows and macOS direct-download
            > assets are intentionally omitted because their signing/notarization
            > jobs did not complete. No unsigned desktop binary is being published.

            > **Linux `.deb` users on v0.2.6 or earlier:** update once by hand —
            > download `daccord-linux-x86_64.deb` below and install it
            > (`sudo dpkg -i daccord-linux-x86_64.deb`).
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          files: artifacts/*

      - name: Rebuild daccord.gg /chat/
        env:
          GH_TOKEN: ${{ secrets.ACCORDWEBSITE_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ACCORDWEBSITE_DISPATCH_TOKEN is unset; web rebuild was not dispatched."
            exit 0
          fi
          gh api --method POST \
            repos/DaccordProject/accordwebsite/dispatches \
            -f event_type=web-export-updated \
            -f "client_payload[tag]=$TAG"
