name: CI

# Continuous integration for the Daccord Flutter client.
#
# - `analyze`  : code generation + static analysis + unit tests (the gate).
#                Runs on every push/PR — this is what blocks merges.
# - `build`    : release builds for web / Android / Linux / Windows, uploaded
#                as artifacts. Only runs on manual `workflow_dispatch` — PRs
#                don't need four release builds to merge, and tagged releases
#                build every platform themselves in release.yml.
#
# This workflow is also `workflow_call`-able so the Release workflow can reuse
# the analyze/test gate (see release.yml).

on:
  push:
    # Tag pushes are handled by release.yml, which calls this workflow via
    # workflow_call — without this, a release tag would trigger CI twice.
    tags-ignore:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Channel used by the *build* job below. The *analyze* job now matrix-tests
  # both beta and stable (see strategy.matrix.channel), so it ignores this.
  # Keep in sync with .fvmrc and release.yml.
  FLUTTER_CHANNEL: beta

# ---------------------------------------------------------------------------
# Self-hosted runners
# ---------------------------------------------------------------------------
# The Linux-capable jobs run on the two org-level self-hosted runners
# (`portainer-daccord-1/2`, label `flutter`) hosted in the `git-runners`
# Portainer stack on Proxmox CT 102. They exist to escape GitHub's 10 GB
# per-repo Actions cache quota, which this project blew through: the pub cache
# alone is ~1.1 GB per platform, so caches were being evicted before they could
# ever be reused.
#
# On those runners `/tmp/runner` is a persistent Docker volume, so:
#   - PUB_CACHE (/tmp/runner/cache/pub) and GRADLE_USER_HOME are set in the
#     container env and survive between jobs. They live OUTSIDE the job
#     workspace on purpose — actions/checkout runs `git clean -ffdx`, which
#     would delete a workspace-local cache every run.
#   - The Flutter SDK is pinned to a persistent cache-path, and flutter-action
#     skips the download when the SDK is already there (setup.sh: `if [ ! -x
#     "$CACHE_PATH/flutter/bin/flutter" ]`).
# So the actions/cache steps and flutter-action's own caching are DISABLED on
# self-hosted: the cache is already local, and uploading it would put us back
# under the quota we left. They stay enabled on GitHub-hosted (Windows/macOS).
#
# Only 2 runners exist, so self-hosted jobs queue two at a time.
# NOTE: this is a PUBLIC repo. Keep "Require approval for all external
# contributors" set under Settings → Actions → Fork pull request workflows —
# without it a fork PR can execute arbitrary code on this hardware.

jobs:
  analyze:
    name: Analyze & Test (${{ matrix.channel }})
    runs-on: [self-hosted, flutter]
    env:
      PUB_CACHE: /tmp/runner/cache/pub
    strategy:
      # Run every channel even if one fails, so a stable-only break and a
      # beta-only break are both reported in the same run.
      fail-fast: false
      matrix:
        # Gate on both the pinned dev channel (.fvmrc) AND stable. A widget/SDK
        # API that diverges between channels — e.g. ReorderableListView's
        # onReorder vs onReorderItem (#138, #107) — is a hard error on one and
        # silently tolerated on the other; analyzing a single channel lets that
        # land on master. Catching it here is the cheap smoke test.
        channel: [beta, stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep the workspace between jobs. The runner's work dir is a
          # persistent volume, so leaving untracked files in place preserves
          # .dart_tool/build (build_runner's incremental state) and turns the
          # clone into an incremental fetch. This replaces the actions/cache
          # step that used to carry .dart_tool/build. Codegen below passes
          # --delete-conflicting-outputs, so stale generated files can't wedge
          # it.
          clean: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          # No GitHub cache: the SDK lives on the runner's persistent volume and
          # flutter-action skips the download when it is already there. Channel
          # is in the path so beta/stable don't clobber each other.
          cache: false
          cache-path: '/tmp/runner/cache/flutter-sdk/:channel:-:version:-:arch:'

      - name: Install dependencies
        # `pub get` fetches git dependencies (flutter_webrtc and its libwebrtc
        # download); a reset connection there is a transient failure, not a
        # broken build, so retry before giving up. `shell: bash` is required —
        # the Windows runner would otherwise run this under PowerShell.
        shell: bash
        run: |
          set -uo pipefail
          n=0
          max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::flutter pub get attempt $n failed; retrying in $((n * 15))s"
            sleep $((n * 15))
          done

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # --no-fatal-infos keeps inherited Bonfire style lints from blocking the
        # gate while still failing on real errors and warnings. Tighten once the
        # port settles.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: analyze
    # Smoke-test artifacts only — run on demand, never automatically on push/PR
    # (analyze is the merge gate) or workflow_call (release.yml builds its own).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # `os` is a JSON array so a single entry can carry a label list for the
    # self-hosted runners (see the header comment) and a plain image name for
    # the GitHub-hosted ones.
    runs-on: ${{ fromJSON(matrix.os) }}
    env:
      PUB_CACHE: ${{ matrix.self_hosted && '/tmp/runner/cache/pub' || format('{0}/.pub-cache', github.workspace) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            platform: web
            os: '["self-hosted","flutter"]'
            self_hosted: true
            artifact: daccord-web
            path: build/web/
          - name: Android
            platform: android
            os: '["self-hosted","flutter"]'
            self_hosted: true
            artifact: daccord-android
            path: build/app/outputs/flutter-apk/*.apk
          - name: Linux
            platform: linux
            os: '["self-hosted","flutter"]'
            self_hosted: true
            artifact: daccord-linux
            path: build/linux/x64/release/bundle/
          - name: Windows
            platform: windows
            # See release.yml: windows-latest's bundled CMake refuses to extract
            # flutter_webrtc's libwebrtc zip through Flutter's plugin symlink.
            os: '["windows-2022"]'
            self_hosted: false
            artifact: daccord-windows
            path: build/windows/x64/runner/Release/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Self-hosted: keep the workspace so .dart_tool/build survives (see
          # the analyze job). GitHub-hosted runners start clean anyway.
          clean: ${{ !matrix.self_hosted }}

      - name: Cache pub + native deps
        # Self-hosted runners keep PUB_CACHE on a persistent volume, so this
        # would only burn the GitHub cache quota re-uploading what is already
        # on local disk.
        if: ${{ !matrix.self_hosted }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache codegen (build_runner)
        if: ${{ !matrix.self_hosted }}
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            codegen-${{ runner.os }}-

      - name: Set up Java 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (self-hosted)
        # GitHub's ubuntu images ship the Android SDK preinstalled; the
        # myoung34/github-runner container does not, so `flutter build apk`
        # would fail with no ANDROID_HOME. Installs into the runner's tool
        # cache, which is on the persistent volume, so this is a one-off cost.
        if: matrix.platform == 'android' && matrix.self_hosted
        uses: android-actions/setup-android@v3

      - name: Cache Gradle (Android)
        # GRADLE_USER_HOME is a persistent path on the self-hosted runners.
        if: matrix.platform == 'android' && !matrix.self_hosted
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev libdw-dev \
            libmpv-dev mpv

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows'
        run: choco install nasm -y
        shell: powershell

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          # Self-hosted: SDK persists on the runner's volume, so skip the
          # GitHub cache entirely. Hosted (Windows): cache as before.
          cache: ${{ !matrix.self_hosted }}
          cache-path: "${{ matrix.self_hosted && '/tmp/runner/cache/flutter-sdk/:channel:-:version:-:arch:' || '' }}"

      - name: Install dependencies
        # `pub get` fetches git dependencies (flutter_webrtc and its libwebrtc
        # download); a reset connection there is a transient failure, not a
        # broken build, so retry before giving up. `shell: bash` is required —
        # the Windows runner would otherwise run this under PowerShell.
        shell: bash
        run: |
          set -uo pipefail
          n=0
          max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::flutter pub get attempt $n failed; retrying in $((n * 15))s"
            sleep $((n * 15))
          done

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build ${{ matrix.name }}
        shell: bash
        # Desktop builds fetch large prebuilt native archives (libwebrtc, mpv)
        # at CMake-configure time; those fetches intermittently 504 or arrive
        # corrupted. Retry with backoff so a transient fetch failure doesn't
        # fail CI.
        run: |
          set -uo pipefail
          build_once() {
            case "${{ matrix.platform }}" in
              web)     flutter build web     --no-tree-shake-icons --release ;;
              android) flutter build apk     --no-tree-shake-icons --flavor github ;;
              linux)   flutter build linux ;;
              windows) flutter build windows ;;
            esac
          }
          n=0; max=3
          until build_once; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::build failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::build attempt $n failed; retrying in $((n * 30))s"
            sleep $((n * 30))
          done

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
