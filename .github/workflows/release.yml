name: Release

# Tag-driven release pipeline for the Daccord Flutter client.
#
# Push a tag like `v1.2.3` (must match the version in pubspec.yaml) to:
#   1. run the full CI workflow as a gate,
#   2. build + package release artifacts for every platform,
#   3. publish a GitHub Release with those artifacts attached.
#
# ---------------------------------------------------------------------------
# Code signing (see docs/release-signing.md for the full runbook)
# ---------------------------------------------------------------------------
# Every signing step is OPTIONAL and gated on its secrets being present. With no
# signing secrets configured this workflow behaves exactly as it did before
# signing existed: unsigned artifacts, release still published. A missing secret
# must never fail a tagged release.
#
#   macOS   DEVELOPER_ID_CERT_P12 + CERT_P12_PASSWORD + ASC_KEY_* + APPLE_TEAM_ID
#           → `fastlane mac dmg` signs the .app (Developer ID + hardened
#             runtime), signs the .dmg, notarizes it with notarytool and staples
#             the ticket. Absent → plain unsigned .dmg (Gatekeeper warns).
#   Windows SIMPLYSIGN_USER + SIMPLYSIGN_TOTP_SECRET  (Certum cloud key), or
#           WINDOWS_CERT_PFX_BASE64 (+ WINDOWS_CERT_PASSWORD)  (exportable .pfx)
#           → Authenticode-signs daccord.exe, the bundled DLLs and the Inno
#             Setup installer via dist/sign-windows.ps1. Absent → unsigned
#             binaries (SmartScreen warns).
#   All     GPG_PRIVATE_KEY (+ GPG_PASSPHRASE)
#           → detached signature (checksums.asc) over SHA256SUMS.txt. Absent →
#             checksums are still published, just unsigned.
#
# SHA256SUMS.txt is always generated and needs no secrets; the in-app updater
# verifies downloads against it.

on:
  push:
    tags:
      - "v*"
  # Manual trigger to exercise the App Store deploy jobs without cutting a real
  # tagged release. The verify/build/release jobs are gated to tag pushes, so a
  # workflow_dispatch run only does the App Store uploads below.
  workflow_dispatch:
    inputs:
      deploy_ios:
        description: "Build the iOS App Store build, upload it and submit it for review"
        type: boolean
        default: true
      deploy_mac:
        description: "Build the Mac App Store build and upload it (no review submission — see docs)"
        type: boolean
        default: true
      deploy_android:
        description: "Build + upload the Android App Bundle to Google Play"
        type: boolean
        default: true
      inspect_play_tracks:
        description: "Print the versionCodes + release names on every Play track (read-only)"
        type: boolean
        default: false
      promote_version_code:
        description: "Promote an existing Play versionCode between tracks (leave blank to skip). Set the deploy_* toggles off to promote without rebuilding."
        type: string
        default: ""
      promote_from_track:
        description: "Track the build to promote currently sits on"
        type: string
        default: "alpha"
      promote_to_track:
        description: "Track to promote it to"
        type: string
        default: "production"

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: beta

jobs:
  verify:
    name: Verify version
    # Only meaningful for a tag push; on workflow_dispatch there's no tag, and
    # skipping this also skips build/release (they need it), leaving just the
    # App Store deploy jobs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate tag matches pubspec version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          echo "Tag v$TAG matches pubspec version $VERSION"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Runs the analyze/test gate. CI's build matrix only runs on
    # workflow_dispatch, so calling it here gates on tests without
    # double-building every platform.
    secrets: inherit

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    # Workspace-local pub cache so it can be persisted across runs (see the
    # "Cache pub + native deps" step). flutter_webrtc downloads its prebuilt
    # libwebrtc archive into its git checkout under here, so caching this dir
    # also caches that ~hundreds-of-MB binary — the thing that 504'd before.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      # Secret-presence flags. `secrets` can't be referenced from a job-level
      # `if:`, but it CAN be referenced from job-level `env:` — so the presence
      # test is resolved once here into a plain string ('true'/'false') and the
      # individual steps gate on `env.*` instead. Every signing step is
      # conditional on one of these: with none of the secrets set the build
      # produces the same unsigned artifacts it always did.
      #
      # The Developer ID Application cert can only be created by the account
      # holder (not the App Store Connect API key), so it may be absent. When it
      # is, the DMG is built unsigned (previous behaviour) instead of failing.
      # Notarization also needs the App Store Connect API key, so require both —
      # otherwise the lane starts, fails on a missing ENV.fetch, and we take the
      # slow path to the same unsigned DMG.
      DEVID_AVAILABLE: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' && secrets.ASC_KEY_P8_BASE64 != '' }}
      # Authenticode signing of the Windows .exe / DLLs / installer. Either
      # credential will do: an exportable .pfx, or a Certum cloud key mounted by
      # dist/simplysign-login.ps1 (which exports WINDOWS_CERT_SHA1 for the
      # signing steps to pick up).
      WINDOWS_SIGN_AVAILABLE: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' || (secrets.SIMPLYSIGN_USER != '' && secrets.SIMPLYSIGN_TOTP_SECRET != '') }}
      SIMPLYSIGN_AVAILABLE: ${{ secrets.SIMPLYSIGN_USER != '' && secrets.SIMPLYSIGN_TOTP_SECRET != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            platform: web
            os: ubuntu-latest
            artifact: daccord-web
          - name: Android
            platform: android
            os: ubuntu-latest
            artifact: daccord-android
          - name: Linux
            platform: linux
            os: ubuntu-latest
            artifact: daccord-linux-x86_64
          - name: Windows
            platform: windows
            # Pinned off windows-latest: that image's bundled CMake (VS 2026,
            # used by `flutter build windows`) enforces libarchive's secure-
            # symlink check and refuses to extract flutter_webrtc's prebuilt
            # libwebrtc zip through Flutter's `.plugin_symlinks/flutter_webrtc`
            # symlink ("Cannot extract through symlink"). The same code built
            # fine on 2026-06-15 and broke ~06-19 with no code change. The
            # older bundled CMake on windows-2022 doesn't trip the check.
            os: windows-2022
            artifact: daccord-windows-x86_64
          - name: macOS
            platform: macos
            # macos-15 ships newer Xcodes than macos-latest's default (16.4);
            # the voice stack (connectivity_plus) needs a recent SDK.
            os: macos-15
            artifact: daccord-macos

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version
        id: version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cache pub + native deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache codegen (build_runner)
        # build_runner keys its own incremental state on input hashes, so a
        # coarse cache key is safe: stale entries are invalidated internally,
        # but unchanged generators are skipped on a hit.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .dart_tool/build
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            codegen-${{ runner.os }}-

      - name: Select latest stable Xcode (macOS)
        # connectivity_plus (pulled in by livekit_client) uses NWPath APIs that
        # only exist in a recent SDK; the runner's default Xcode 16.4 lacks them.
        if: matrix.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Ruby (macOS)
        # Fastlane (gym + notarize) signs and notarizes the DMG below.
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Import Developer ID certificate (macOS)
        # Developer ID Application cert → the DMG's .app is signed with a
        # hardened runtime and notarized so Gatekeeper allows direct downloads.
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Set up Java 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle (Android)
        if: matrix.platform == 'android'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache CocoaPods (macOS)
        if: matrix.platform == 'macos'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev libdw-dev \
            libmpv-dev mpv

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows'
        run: choco install nasm -y
        shell: powershell

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        # `pub get` fetches git dependencies (flutter_webrtc and its libwebrtc
        # download); a reset connection there is a transient failure, not a
        # broken build, so retry before giving up. `shell: bash` is required —
        # the Windows runner would otherwise run this under PowerShell.
        shell: bash
        run: |
          set -uo pipefail
          n=0
          max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::flutter pub get attempt $n failed; retrying in $((n * 15))s"
            sleep $((n * 15))
          done

      - name: Update CocoaPods spec repo (macOS)
        # media_kit's mpv pods need a fresh spec repo; the runner's cache is
        # often too old, failing pod install with "specs repository is too
        # out-of-date to satisfy dependencies".
        if: matrix.platform == 'macos'
        run: pod repo update

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build ${{ matrix.name }}
        shell: bash
        # Desktop builds fetch large prebuilt native archives (libwebrtc, mpv)
        # from third-party GitHub releases at CMake-configure time. Those fetches
        # intermittently 504 or arrive corrupted and fail the whole release.
        # Retry the build a few times with backoff so a transient fetch failure
        # doesn't sink a tagged release; a cached archive also short-circuits it.
        run: |
          set -uo pipefail
          build_once() {
            case "${{ matrix.platform }}" in
              web)     flutter build web     --no-tree-shake-icons --release ;;
              android) flutter build apk     --no-tree-shake-icons -v --flavor github ;;
              linux)   flutter build linux   -v ;;
              windows) flutter build windows -v ;;
              macos)   flutter build macos   -v ;;
            esac
          }
          n=0; max=3
          until build_once; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::build failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::build attempt $n failed; retrying in $((n * 30))s"
            sleep $((n * 30))
          done

      - name: Package (Web)
        if: matrix.platform == 'web'
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" .

      - name: Package (Android)
        if: matrix.platform == 'android'
        run: cp build/app/outputs/flutter-apk/app-github-release.apk "${{ matrix.artifact }}.apk"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        # `.tgz`, NOT `.tar.gz` — this suffix is load-bearing. Clients at v0.2.6
        # and earlier pick a `.tar.gz` asset unconditionally on Linux and try to
        # swap it into a `.deb` install's root-owned /opt, which silently fails
        # and relaunches the old build; those clients are frozen, so withholding
        # the suffix is the only way to break them out of the loop. With no
        # `.tar.gz` present they fall back to offering the `.deb` as a manual
        # download. See update_controller._installableExts and the guard in the
        # release job below.
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}.tgz" .

      - name: Build .deb (Linux)
        if: matrix.platform == 'linux'
        run: dist/build-deb.sh "${{ steps.version.outputs.APP_VERSION }}" "${{ matrix.artifact }}.deb"

      - name: Sign, package & notarize DMG (macOS)
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        # gym re-exports the (already Flutter-built) app signed with Developer ID
        # + hardened runtime, then we wrap it in a single universal (arm64 +
        # x86_64) DMG and notarize+staple it so Gatekeeper trusts the download.
        # This is the direct-download build, so the self-updater stays enabled
        # (no APP_STORE define).
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: com.cattrall.daccord
          DMG_OUTPUT: daccord-macos-universal.dmg
        run: |
          set -o pipefail
          if bundle exec fastlane mac dmg; then
            echo "Notarized DMG built."
          else
            echo "::warning::Notarized DMG failed; shipping an UNSIGNED DMG so the release still completes."
            ls -R build/macos-signed 2>/dev/null || true
            APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
            TMP="$RUNNER_TEMP/dmg"; rm -rf "$TMP"; mkdir -p "$TMP"
            cp -R "$APP" "$TMP/"
            ln -s /Applications "$TMP/Applications"
            hdiutil create -volname "Daccord" -srcfolder "$TMP" -ov -format UDZO \
              "$GITHUB_WORKSPACE/daccord-macos-universal.dmg"
            rm -rf "$TMP"
          fi

      - name: Package unsigned DMG (macOS, no Developer ID cert)
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE != 'true'
        # Fallback when the Developer ID cert secret isn't set: ship the same
        # universal DMG unsigned (the pre-notarization behaviour) rather than
        # failing the release. Gatekeeper will warn on first launch.
        run: |
          echo "::warning::DEVELOPER_ID_CERT_P12 not set — building UNSIGNED DMG (not notarized)."
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          TMP="$RUNNER_TEMP/dmg"
          rm -rf "$TMP"; mkdir -p "$TMP"
          cp -R "$APP" "$TMP/"
          ln -s /Applications "$TMP/Applications"
          hdiutil create -volname "Daccord" -srcfolder "$TMP" -ov -format UDZO \
            "$GITHUB_WORKSPACE/daccord-macos-universal.dmg"
          rm -rf "$TMP"

      - name: Verify signature & notarization (macOS)
        # Purely diagnostic, and never fatal: the DMG has already been built by
        # this point, so the only thing failing here would achieve is losing the
        # release. It exists so the log says plainly whether the artifact users
        # are about to download will clear Gatekeeper — including when the
        # fastlane lane fell back to an unsigned DMG.
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        continue-on-error: true
        run: |
          DMG="$GITHUB_WORKSPACE/daccord-macos-universal.dmg"
          codesign -dv --verbose=4 "$DMG" 2>&1 || echo "::warning::$DMG is not code-signed"
          xcrun stapler validate "$DMG" || echo "::warning::$DMG has no stapled notarization ticket"
          spctl -a -t open --context context:primary-signature -v "$DMG" \
            || echo "::warning::Gatekeeper would reject $DMG"

      - name: Open SimplySign session (Windows)
        # Certum's cloud key can't be exported, so it has to be mounted as a
        # virtual smart card before signtool can see it. This runs once and
        # exports WINDOWS_CERT_SHA1 through $GITHUB_ENV; both signing steps
        # below then pick it up automatically. The session stays open for the
        # rest of the job.
        #
        # It drives a GUI with SendKeys because Certum ship no login CLI, so it
        # is the least reliable step in this workflow by some margin. It exits 0
        # on every failure path, which leaves WINDOWS_CERT_SHA1 unset and lands
        # us on the usual unsigned-artifacts fallback.
        if: matrix.platform == 'windows' && env.SIMPLYSIGN_AVAILABLE == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: ./dist/simplysign-login.ps1

      - name: Sign binaries (Windows)
        # Authenticode-sign the app and the DLLs we build BEFORE they are zipped
        # or swept into the installer, so every shipped copy carries the
        # signature. Skipped entirely when no signing credential is configured,
        # and `continue-on-error` keeps even a hard signing failure (expired cert,
        # timestamp server down) from sinking a tagged release — it degrades to
        # today's unsigned artifacts with a warning on the step.
        if: matrix.platform == 'windows' && env.WINDOWS_SIGN_AVAILABLE == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Optional repo variable; the script defaults to DigiCert's public
          # RFC-3161 server. Some CAs require their own timestamp endpoint.
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./dist/sign-windows.ps1 `
            build/windows/x64/runner/Release/daccord.exe `
            build/windows/x64/runner/Release/*.dll

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress
        shell: powershell

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        # OutputDir in installer.iss is `..`, so the .exe lands in the workspace
        # root as daccord-windows-x86_64-setup.exe.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.APP_VERSION }}" dist\installer.iss

      - name: Sign installer (Windows)
        # The installer is a fresh .exe produced by ISCC, so it needs its own
        # signature — the signed payload inside it doesn't cover the wrapper,
        # and the wrapper is what SmartScreen judges on download. Same gating
        # and same never-fail-the-release policy as the binaries step above.
        # (The uninstaller Inno generates at install time is NOT signed; that
        # needs Inno's SignTool/SignedUninstaller directives — see
        # docs/release-signing.md.)
        if: matrix.platform == 'windows' && env.WINDOWS_SIGN_AVAILABLE == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./dist/sign-windows.ps1 daccord-windows-x86_64-setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tgz
            ${{ matrix.artifact }}.apk
            ${{ matrix.artifact }}.deb
            daccord-windows-x86_64-setup.exe
            daccord-macos-universal.dmg
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    env:
      # As in the build job: `secrets` is unavailable in a step `if:`, so resolve
      # the presence test into a plain string here and gate the step on env.
      # Unset → checksums still ship, just without a detached signature.
      GPG_AVAILABLE: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: daccord-*
          merge-multiple: true

      - name: Guard against a .tar.gz asset
        # Publishing any asset whose name ends in `.tar.gz` re-arms the broken
        # self-updater in clients ≤ v0.2.6: on Linux they select it regardless of
        # whether the install root is writable, so a `.deb` install downloads it,
        # runs a swap against root-owned /opt that can't succeed, and relaunches
        # the old build with no error shown. The Linux bundle ships as `.tgz` so
        # those clients find nothing installable and offer the `.deb` instead.
        run: |
          cd artifacts
          if ls | grep -q '\.tar\.gz$'; then
            echo "::error::Refusing to publish a .tar.gz asset — it silently breaks self-update on clients <= v0.2.6. Ship the Linux bundle as .tgz."
            ls
            exit 1
          fi

      - name: Generate checksums
        # SHA256SUMS.txt lets the in-app self-updater verify a downloaded bundle
        # before swapping it in (see update_controller._expectedSha), and gives
        # manual downloaders an integrity check. Format: "<sha256>  <filename>".
        # Covers every published artifact on every platform; needs no secrets, so
        # it always runs. Signature/checksum ordering matters: this runs after
        # the build jobs, so the hashes are of the *signed* .dmg / .exe.
        run: |
          cd artifacts
          # Exclude the checksum file and any signature from the list it hashes:
          # the command substitution is expanded before the redirect truncates
          # SHA256SUMS.txt, so a re-run would otherwise hash a stale copy of it.
          mapfile -t files < <(
            find . -maxdepth 1 -type f \
              ! -name 'SHA256SUMS.txt' ! -name '*.asc' -printf '%P\n' | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            # Fail loudly rather than let sha256sum fall through to reading
            # stdin and hang the job until the 6h timeout.
            echo "::error::No artifacts were downloaded — nothing to checksum."
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign checksums (GPG)
        # Detached, ASCII-armoured signature over SHA256SUMS.txt — hashing every
        # artifact and signing just the manifest is the usual distro pattern, and
        # it means one signature covers all platforms.
        #
        # The file is `checksums.asc`, NOT `SHA256SUMS.txt.asc`: the in-app
        # updater picks the checksum manifest with
        # `assets.firstWhere(name.toUpperCase().contains('SHA256SUMS'))`
        # (update_controller._expectedSha), and GitHub does not promise an asset
        # order. A signature named `SHA256SUMS.txt.asc` could therefore be picked
        # instead of the manifest, and every self-update would silently skip
        # checksum verification. Keeping the token out of the name makes the
        # match unambiguous. Shipped clients can't be fixed, so the filename is
        # load-bearing — same reasoning as the `.tgz` suffix above.
        if: env.GPG_AVAILABLE == 'true'
        continue-on-error: true
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$KEY" ]; then
            echo "::warning::GPG_PRIVATE_KEY imported no secret key — publishing unsigned checksums."
            exit 0
          fi
          echo "Signing SHA256SUMS.txt with key $KEY"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE:-}" \
            --local-user "$KEY" --armor --detach-sign \
            --output artifacts/checksums.asc artifacts/SHA256SUMS.txt
          gpg --verify artifacts/checksums.asc artifacts/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          # Prepended to the auto-generated notes. The in-app Updates page renders
          # this body (AppRelease.notes), so it's the one channel that reaches
          # users stranded on a build whose self-updater can't apply anything.
          # Drop this notice once ≤ v0.2.6 installs have aged out.
          body: |
            > **Linux `.deb` users on v0.2.6 or earlier:** update once by hand —
            > download `daccord-linux-x86_64.deb` below and install it
            > (`sudo dpkg -i daccord-linux-x86_64.deb`). Self-update could not
            > replace a system install in those builds and failed silently; from
            > v0.2.7 onward it updates the package for you (with an admin prompt).
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  # ---------------------------------------------------------------------------
  # Rebuild daccord.gg. The website image bakes in the `daccord-web.zip` asset
  # from *this* repo's latest release and serves it at daccord.gg/chat/, so a new
  # release does nothing for web users until accordwebsite rebuilds. Its workflow
  # already listens for a `web-export-updated` repository_dispatch; nothing was
  # sending one, so /chat/ sat on v0.2.6 for the whole v0.2.7–v0.2.9 window and
  # only ever refreshed when someone happened to push to accordwebsite.
  #
  # Needs ACCORDWEBSITE_DISPATCH_TOKEN: a PAT (or GitHub App token) with
  # `contents: write` on DaccordProject/accordwebsite. GITHUB_TOKEN can't be used
  # — it's scoped to this repo and can't dispatch to another one.
  # ---------------------------------------------------------------------------
  website-rebuild:
    name: Rebuild daccord.gg /chat/
    needs: release
    runs-on: ubuntu-latest
    # As elsewhere in this workflow, a missing secret must never fail a tagged
    # release: without the token this job is skipped, and the website just keeps
    # serving the previous client until someone rebuilds it by hand.
    if: ${{ success() && github.event_name == 'push' && github.repository == 'DaccordProject/daccord' }}
    steps:
      - name: Notify accordwebsite of the new web export
        env:
          GH_TOKEN: ${{ secrets.ACCORDWEBSITE_DISPATCH_TOKEN }}
          # Routed through env rather than interpolated into the script below —
          # github.ref_name is attacker-influenceable (whoever can push a tag
          # controls its value) and untrusted expressions must never be spliced
          # directly into a run: block. See GitHub's script-injection hardening
          # guidance.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ACCORDWEBSITE_DISPATCH_TOKEN not set — skipping the daccord.gg rebuild. Trigger accordwebsite's 'Build and publish Docker image' workflow by hand to ship $TAG to /chat/."
            exit 0
          fi
          gh api --method POST \
            repos/DaccordProject/accordwebsite/dispatches \
            -f event_type=web-export-updated \
            -f "client_payload[tag]=$TAG"
          echo "Dispatched web-export-updated for $TAG."

  # ---------------------------------------------------------------------------
  # App Store deploys. These run on a tag push and on workflow_dispatch (gated
  # by the deploy_ios / deploy_mac inputs). They build the *store* variants
  # (App Sandbox / no self-updater via --dart-define=APP_STORE=true) and upload
  # to App Store Connect using an App Store Connect API key. Signing assets come
  # from repo secrets — see docs/app-store-deploy.md.
  # ---------------------------------------------------------------------------
  ios-appstore:
    name: iOS App Store
    needs: ci
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy_ios) }}
    runs-on: macos-15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags: the What's New text is derived from the commits
          # since the previous release tag, which a shallow clone cannot see.
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache pub + native deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        # `pub get` fetches git dependencies (flutter_webrtc and its libwebrtc
        # download); a reset connection there is a transient failure, not a
        # broken build, so retry before giving up. `shell: bash` is required —
        # the Windows runner would otherwise run this under PowerShell.
        shell: bash
        run: |
          set -uo pipefail
          n=0
          max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::flutter pub get attempt $n failed; retrying in $((n * 15))s"
            sleep $((n * 15))
          done

      - name: Update CocoaPods spec repo
        run: pod repo update

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_B64" | base64 --decode > "$DIR/daccord_ios_appstore.mobileprovision"

      - name: Build iOS (Flutter, unsigned)
        # Compiles the Dart/Flutter side and writes Generated.xcconfig; gym then
        # archives + signs. CFBundleShortVersionString must be a numeric x.y.z,
        # so strip any prerelease/build suffix from the pubspec version (e.g. a
        # `0.2.4-rc.1` tag still uploads as marketing version `0.2.4`).
        run: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[-+].*//')
          echo "App Store marketing version: $BUILD_NAME (build ${{ github.run_number }})"
          # Reused by the submit step so deliver edits the same version record
          # that CFBundleShortVersionString declares.
          echo "APP_STORE_VERSION=$BUILD_NAME" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_STORE=true

      - name: Generate What's New
        # Apple rejects a version submission with no release notes, so they have
        # to be produced unattended. See dist/app-store-release-notes.sh.
        run: ./dist/app-store-release-notes.sh

      - name: Archive, sign, upload & submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: com.cattrall.daccord
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: bundle exec fastlane ios appstore

  mac-appstore:
    name: Mac App Store
    needs: ci
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy_mac) }}
    runs-on: macos-15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # See the iOS job: the release notes need the tag history.
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache pub + native deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        # `pub get` fetches git dependencies (flutter_webrtc and its libwebrtc
        # download); a reset connection there is a transient failure, not a
        # broken build, so retry before giving up. `shell: bash` is required —
        # the Windows runner would otherwise run this under PowerShell.
        shell: bash
        run: |
          set -uo pipefail
          n=0
          max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::flutter pub get attempt $n failed; retrying in $((n * 15))s"
            sleep $((n * 15))
          done

      - name: Update CocoaPods spec repo
        run: pod repo update

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Import Mac Installer Distribution certificate
        # Signs the .pkg installer that the Mac App Store ingests.
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.CERT_P12_PASSWORD }}
          create-keychain: false

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_B64" | base64 --decode > "$DIR/daccord_mac_appstore.provisionprofile"

      - name: Use sandboxed App Store entitlements
        # Mac App Store requires the App Sandbox. Swap the sandboxed entitlements
        # over the (non-sandboxed) Release.entitlements in THIS job's checkout
        # only; the Runner target's CODE_SIGN_ENTITLEMENTS already points there.
        # The DMG job's checkout is untouched, so it stays non-sandboxed.
        run: cp macos/Runner/AppStore.entitlements macos/Runner/Release.entitlements

      - name: Build macOS (Flutter, unsigned)
        # Numeric marketing version only (see the iOS job's note).
        run: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[-+].*//')
          echo "App Store marketing version: $BUILD_NAME (build ${{ github.run_number }})"
          # Reused by the submit step (see the iOS job's note).
          echo "APP_STORE_VERSION=$BUILD_NAME" >> "$GITHUB_ENV"
          # NOTE: flutter build macos has no --no-codesign flag (iOS-only); gym
          # re-signs on export.
          flutter build macos --release \
            --build-name="$BUILD_NAME" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_STORE=true

      - name: Archive, sign & upload
        # Upload only, no review submission: the macOS product page has never
        # been filled in, so there is nothing to submit yet and deliver's
        # metadata step hard-fails on the missing review detail. See the
        # :appstore lane and docs/app-store-deploy.md. No release notes are
        # generated here for the same reason — nothing delivers them.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: com.cattrall.daccord
          MAC_PROFILE_NAME: ${{ secrets.MAC_PROFILE_NAME }}
        run: bundle exec fastlane mac appstore

  # ---------------------------------------------------------------------------
  # Google Play deploy. Builds a signed Android App Bundle (.aab) and uploads it
  # to Google Play via fastlane supply, authenticating with a Play service
  # account. Like the Apple jobs it runs on a tag push and on workflow_dispatch
  # (gated by deploy_android). The AAB is signed with the upload key from
  # secrets; final delivery signing is handled by Play App Signing. Listing
  # metadata/graphics live in the Play Console — only the binary is uploaded.
  # See docs/app-store-deploy.md.
  # ---------------------------------------------------------------------------
  android-play:
    name: Google Play
    needs: ci
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy_android) }}
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache pub + native deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Ruby
        # fastlane supply (upload_to_play_store) does the Play upload.
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        # `pub get` fetches git dependencies (flutter_webrtc and its libwebrtc
        # download); a reset connection there is a transient failure, not a
        # broken build, so retry before giving up. `shell: bash` is required —
        # the Windows runner would otherwise run this under PowerShell.
        shell: bash
        run: |
          set -uo pipefail
          n=0
          max=3
          until flutter pub get; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::flutter pub get failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::flutter pub get attempt $n failed; retrying in $((n * 15))s"
            sleep $((n * 15))
          done

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode upload keystore
        # The AAB must be signed with the upload key before Play accepts it; Play
        # App Signing then re-signs with the app signing key for delivery.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Write Play service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Build Android App Bundle
        # Numeric marketing version only (mirrors the Apple jobs). The Play
        # build sets APP_STORE=true to disable the in-app GitHub self-updater
        # (Play policy forbids self-updating; the direct-download APK keeps it).
        # versionCode = run number so it strictly increases across uploads.
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[-+].*//')
          echo "Play version: $BUILD_NAME (build ${{ github.run_number }})"
          # Reused by the upload step to name the release in the Play Console,
          # so the console label can't drift from the binary's versionName.
          echo "PLAY_VERSION_NAME=$BUILD_NAME" >> "$GITHUB_ENV"
          flutter build appbundle --release --flavor play \
            --build-name="$BUILD_NAME" \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_STORE=true

      - name: Upload signed AAB artifact
        # Keep the exact signed bundle even if the Play API upload fails, so the
        # first-ever release can be uploaded manually via the Play Console (a
        # brand-new app rejects API uploads with an opaque 500 until its first
        # release is created by hand).
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daccord-playstore-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to Google Play
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
          ANDROID_PACKAGE_NAME: com.daccord_projects.daccord
          ANDROID_AAB_PATH: build/app/outputs/bundle/playRelease/app-play-release.aab
          # PLAY_VERSION_NAME is exported by the build step above.
          # A tagged release always ships live to all users: production track,
          # rollout completed. Deliberately not overridable by repo variables —
          # a stale PLAY_TRACK/PLAY_RELEASE_STATUS silently parked 0.2.7 as an
          # alpha draft that nobody noticed until it was missing from Play.
          PLAY_TRACK: production
          PLAY_RELEASE_STATUS: completed
        run: bundle exec fastlane android play

  # ---------------------------------------------------------------------------
  # Promote a build that is already in Play from one track to another, without
  # rebuilding — so the exact binary that was tested is the one that ships.
  # Manual-only: pass promote_version_code (and turn the deploy_* toggles off).
  # Needs no Flutter/Java/Gradle and no CI gate; it uploads nothing, it just
  # repoints a track at an existing versionCode.
  # ---------------------------------------------------------------------------
  android-promote:
    name: Promote on Google Play
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_version_code != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Write Play service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Promote on Google Play
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
          ANDROID_PACKAGE_NAME: com.daccord_projects.daccord
          PLAY_VERSION_CODE: ${{ inputs.promote_version_code }}
          PLAY_FROM_TRACK: ${{ inputs.promote_from_track }}
          PLAY_TO_TRACK: ${{ inputs.promote_to_track }}
          PLAY_RELEASE_STATUS: completed
        run: bundle exec fastlane android promote

  # ---------------------------------------------------------------------------
  # Read-only dump of what is on each Play track. Changes nothing; exists so a
  # promotion can be aimed at the right versionCode instead of a guess.
  # ---------------------------------------------------------------------------
  android-tracks:
    name: Inspect Google Play tracks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_play_tracks }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Write Play service-account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"

      - name: Dump tracks
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
          ANDROID_PACKAGE_NAME: com.daccord_projects.daccord
        run: bundle exec fastlane android tracks
