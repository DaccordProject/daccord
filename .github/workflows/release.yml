name: Release

# Tag-driven release pipeline for the Daccord Flutter client.
#
# Push a tag like `v1.2.3` (must match the version in pubspec.yaml) to:
#   1. run the full CI workflow as a gate,
#   2. build + package release artifacts for every platform,
#   3. publish a GitHub Release with those artifacts attached.

on:
  push:
    tags:
      - "v*"
  # Manual trigger to exercise the App Store deploy jobs without cutting a real
  # tagged release. The verify/build/release jobs are gated to tag pushes, so a
  # workflow_dispatch run only does the App Store uploads below.
  workflow_dispatch:
    inputs:
      deploy_ios:
        description: "Build + upload the iOS App Store build to TestFlight"
        type: boolean
        default: true
      deploy_mac:
        description: "Build + upload the Mac App Store build to App Store Connect"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: beta

jobs:
  verify:
    name: Verify version
    # Only meaningful for a tag push; on workflow_dispatch there's no tag, and
    # skipping this also skips build/release (they need it), leaving just the
    # App Store deploy jobs.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches pubspec version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          echo "Tag v$TAG matches pubspec version $VERSION"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    # Runs the analyze/test gate. CI's build matrix only runs on
    # workflow_dispatch, so calling it here gates on tests without
    # double-building every platform.
    secrets: inherit

  build:
    name: Build ${{ matrix.name }}
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    # Workspace-local pub cache so it can be persisted across runs (see the
    # "Cache pub + native deps" step). flutter_webrtc downloads its prebuilt
    # libwebrtc archive into its git checkout under here, so caching this dir
    # also caches that ~hundreds-of-MB binary — the thing that 504'd before.
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      # The Developer ID Application cert can only be created by the account
      # holder (not the App Store Connect API key), so it may be absent. When it
      # is, the DMG is built unsigned (previous behaviour) instead of failing.
      DEVID_AVAILABLE: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            platform: web
            os: ubuntu-latest
            artifact: daccord-web
          - name: Android
            platform: android
            os: ubuntu-latest
            artifact: daccord-android
          - name: Linux
            platform: linux
            os: ubuntu-latest
            artifact: daccord-linux-x86_64
          - name: Windows
            platform: windows
            os: windows-latest
            artifact: daccord-windows-x86_64
          - name: macOS
            platform: macos
            # macos-15 ships newer Xcodes than macos-latest's default (16.4);
            # the voice stack (connectivity_plus) needs a recent SDK.
            os: macos-15
            artifact: daccord-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cache pub + native deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache codegen (build_runner)
        # build_runner keys its own incremental state on input hashes, so a
        # coarse cache key is safe: stale entries are invalidated internally,
        # but unchanged generators are skipped on a hit.
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: codegen-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            codegen-${{ runner.os }}-

      - name: Select latest stable Xcode (macOS)
        # connectivity_plus (pulled in by livekit_client) uses NWPath APIs that
        # only exist in a recent SDK; the runner's default Xcode 16.4 lacks them.
        if: matrix.platform == 'macos'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby (macOS)
        # Fastlane (gym + notarize) signs and notarizes the DMG below.
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Import Developer ID certificate (macOS)
        # Developer ID Application cert → the DMG's .app is signed with a
        # hardened runtime and notarized so Gatekeeper allows direct downloads.
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Set up Java 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle (Android)
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache CocoaPods (macOS)
        if: matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev libdw-dev \
            libmpv-dev mpv

      - name: Install NASM (Windows)
        if: matrix.platform == 'windows'
        run: choco install nasm -y
        shell: powershell

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update CocoaPods spec repo (macOS)
        # media_kit's mpv pods need a fresh spec repo; the runner's cache is
        # often too old, failing pod install with "specs repository is too
        # out-of-date to satisfy dependencies".
        if: matrix.platform == 'macos'
        run: pod repo update

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build ${{ matrix.name }}
        shell: bash
        # Desktop builds fetch large prebuilt native archives (libwebrtc, mpv)
        # from third-party GitHub releases at CMake-configure time. Those fetches
        # intermittently 504 or arrive corrupted and fail the whole release.
        # Retry the build a few times with backoff so a transient fetch failure
        # doesn't sink a tagged release; a cached archive also short-circuits it.
        env:
          # GlitchTip DSN baked into release builds (reporting stays opt-in at
          # runtime). When the secret is unset the empty define falls back to
          # the in-repo dev DSN (see
          # lib/features/error_reporting/controllers/error_reporting.dart).
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -uo pipefail
          DEFINES=(--dart-define=SENTRY_DSN="${SENTRY_DSN:-}")
          build_once() {
            case "${{ matrix.platform }}" in
              web)     flutter build web     --no-tree-shake-icons --release "${DEFINES[@]}" ;;
              android) flutter build apk     --no-tree-shake-icons -v "${DEFINES[@]}" ;;
              linux)   flutter build linux   -v "${DEFINES[@]}" ;;
              windows) flutter build windows -v "${DEFINES[@]}" ;;
              macos)   flutter build macos   -v "${DEFINES[@]}" ;;
            esac
          }
          n=0; max=3
          until build_once; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "::error::build failed after $max attempts" >&2
              exit 1
            fi
            echo "::warning::build attempt $n failed; retrying in $((n * 30))s"
            sleep $((n * 30))
          done

      - name: Package (Web)
        if: matrix.platform == 'web'
        run: |
          cd build/web
          zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" .

      - name: Package (Android)
        if: matrix.platform == 'android'
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ matrix.artifact }}.apk"

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/${{ matrix.artifact }}.tar.gz" .

      - name: Build .deb (Linux)
        if: matrix.platform == 'linux'
        run: dist/build-deb.sh "${{ steps.version.outputs.APP_VERSION }}" "${{ matrix.artifact }}.deb"

      - name: Sign, package & notarize DMG (macOS)
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE == 'true'
        # gym re-exports the (already Flutter-built) app signed with Developer ID
        # + hardened runtime, then we wrap it in a single universal (arm64 +
        # x86_64) DMG and notarize+staple it so Gatekeeper trusts the download.
        # This is the direct-download build, so the self-updater stays enabled
        # (no APP_STORE define).
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: com.cattrall.daccord
          DMG_OUTPUT: daccord-macos-universal.dmg
        run: bundle exec fastlane mac dmg

      - name: Package unsigned DMG (macOS, no Developer ID cert)
        if: matrix.platform == 'macos' && env.DEVID_AVAILABLE != 'true'
        # Fallback when the Developer ID cert secret isn't set: ship the same
        # universal DMG unsigned (the pre-notarization behaviour) rather than
        # failing the release. Gatekeeper will warn on first launch.
        run: |
          echo "::warning::DEVELOPER_ID_CERT_P12 not set — building UNSIGNED DMG (not notarized)."
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          TMP="$RUNNER_TEMP/dmg"
          rm -rf "$TMP"; mkdir -p "$TMP"
          cp -R "$APP" "$TMP/"
          ln -s /Applications "$TMP/Applications"
          hdiutil create -volname "Daccord" -srcfolder "$TMP" -ov -format UDZO \
            "$GITHUB_WORKSPACE/daccord-macos-universal.dmg"
          rm -rf "$TMP"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Install Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup -y --no-progress
        shell: powershell

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        # OutputDir in installer.iss is `..`, so the .exe lands in the workspace
        # root as daccord-windows-x86_64-setup.exe.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.APP_VERSION }}" dist\installer.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.apk
            ${{ matrix.artifact }}.deb
            daccord-windows-x86_64-setup.exe
            daccord-macos-universal.dmg
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: daccord-*
          merge-multiple: true

      - name: Generate checksums
        # SHA256SUMS.txt lets the in-app self-updater verify a downloaded bundle
        # before swapping it in (see update_controller._expectedSha), and gives
        # manual downloaders an integrity check. Format: "<sha256>  <filename>".
        run: |
          cd artifacts
          sha256sum $(find . -maxdepth 1 -type f -printf '%P\n' | sort) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*

  # ---------------------------------------------------------------------------
  # App Store deploys. These run on a tag push and on workflow_dispatch (gated
  # by the deploy_ios / deploy_mac inputs). They build the *store* variants
  # (App Sandbox / no self-updater via --dart-define=APP_STORE=true) and upload
  # to App Store Connect using an App Store Connect API key. Signing assets come
  # from repo secrets — see docs/app-store-deploy.md.
  # ---------------------------------------------------------------------------
  ios-appstore:
    name: iOS App Store
    needs: ci
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy_ios) }}
    runs-on: macos-15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache pub + native deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update CocoaPods spec repo
        run: pod repo update

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_B64" | base64 --decode > "$DIR/daccord_ios_appstore.mobileprovision"

      - name: Build iOS (Flutter, unsigned)
        # Compiles the Dart/Flutter side and writes Generated.xcconfig (build
        # name from pubspec, build number from the run); gym then archives + signs.
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build ios --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=APP_STORE=true
          --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - name: Archive, sign & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: com.cattrall.daccord
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: bundle exec fastlane ios beta

  mac-appstore:
    name: Mac App Store
    needs: ci
    if: ${{ success() && (github.event_name == 'push' || inputs.deploy_mac) }}
    runs-on: macos-15
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache pub + native deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/livekit_client/**/*.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Update CocoaPods spec repo
        run: pod repo update

      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DIST_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.CERT_P12_PASSWORD }}

      - name: Import Mac Installer Distribution certificate
        # Signs the .pkg installer that the Mac App Store ingests.
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          p12-password: ${{ secrets.CERT_P12_PASSWORD }}
          keychain: signing_temp
          keychain-password: ${{ secrets.CERT_P12_PASSWORD }}
          create-keychain: false

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          echo "$PROFILE_B64" | base64 --decode > "$DIR/daccord_mac_appstore.provisionprofile"

      - name: Use sandboxed App Store entitlements
        # Mac App Store requires the App Sandbox. Swap the sandboxed entitlements
        # over the (non-sandboxed) Release.entitlements in THIS job's checkout
        # only; the Runner target's CODE_SIGN_ENTITLEMENTS already points there.
        # The DMG job's checkout is untouched, so it stays non-sandboxed.
        run: cp macos/Runner/AppStore.entitlements macos/Runner/Release.entitlements

      - name: Build macOS (Flutter, unsigned)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build macos --release --no-codesign
          --build-number=${{ github.run_number }}
          --dart-define=APP_STORE=true
          --dart-define=SENTRY_DSN="${SENTRY_DSN:-}"

      - name: Archive, sign & upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: com.cattrall.daccord
          MAC_PROFILE_NAME: ${{ secrets.MAC_PROFILE_NAME }}
        run: bundle exec fastlane mac appstore
