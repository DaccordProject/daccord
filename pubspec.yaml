name: bonfire
description: "A fast, cross-platform Flutter client for Daccord."
publish_to: "none"

version: 0.2.7+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  markdown_viewer:
    path: packages/markdown_viewer

  # Promoted from transitive (pulled in by markdown_viewer) so message rendering
  # can define custom inline markdown syntaxes for Accord mentions/channels/emoji.
  dart_markdown: 3.1.7

  # Accord protocol SDK — the networking layer that replaced firebridge.
  # Vendored in-tree (packages/accordkit) and maintained here.
  accordkit:
    path: packages/accordkit

  google_fonts: ^6.2.1
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  go_router: ^17.0.0
  flutter_prism: ^0.2.2

  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: ./libs/universal/media_kit_libs_video

  video_player_media_kit:
    git: 
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: video_player_media_kit

  url_launcher: ^6.2.6
  app_links: ^6.3.0
  collection: ^1.18.0
  http: ^1.2.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  universal_platform: ^1.1.0
  hive_ce: ^2.5.0
  universal_io: ^2.2.2
  # Single source of truth for the app version: reads the version Flutter bakes
  # in from pubspec at build time, so `kAppVersion` (lib/shared/app_info.dart)
  # never has to be hand-edited. Bump only `version:` above.
  # Pinned to 9.x: the livekit_client fork pulls win32 ^5 (via device_info_plus),
  # and package_info_plus >=10 requires win32 ^6, which conflicts.
  package_info_plus: ^9.0.0
  # Desktop window control — restore/persist last window size & position.
  window_manager: ^0.4.3

  file_picker: ^10.3.6
  path: ^1.9.0
  crypto: ^3.0.6
  flutter_local_notifications: ^19.5.0
  flutter_webrtc: ^1.2.0
  livekit_client: ^2.8.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  pasteboard: ^0.5.0
  # Self-update: extract downloaded desktop bundles (zip / tar.gz) before the
  # in-place binary swap. Pure Dart, used only by features/updates. Pinned to the
  # already-resolved transitive version to avoid a version-solve conflict.
  archive: ^3.6.1
  crop_your_image: ^2.0.0
  desktop_drop: ^0.7.1

dependency_overrides:
  http: ^1.2.1

  # #68: local fork of livekit_client 2.8.0 that, when [kLiveKitSkipNativeRelease]
  # is set (main.dart, Linux only), skips every native WebRTC resource free on
  # disconnect (MediaStreamTrack.stop/dispose, MediaStream.dispose, the publisher
  # PeerConnection removeTrack/close/dispose). Those frees crash on Linux because
  # the prebuilt libwebrtc.so heap-corrupts during the (server-forced) teardown.
  # We leak the native objects instead; the OS reclaims them at process exit.
  livekit_client:
    path: packages/livekit_client

  # livekit_client 2.8.0 hard-pins flutter_webrtc 1.4.0 (to avoid iOS/macOS pod
  # conflicts — irrelevant on Linux). We override past 1.4.1 for two Linux fixes
  # needed by daccord-app #68 (voice channel-switch ~10s stall):
  #   - #2021 "sanitize UTF-8 for device strings before platform messages" (fixes
  #     `FormatException: Missing extension byte` on mic publish), and
  #   - the libwebrtc bump to m144.7559.02 + desktop audio-options change, which
  #     eliminate the ~10s setLocalDescription stall on the 2nd connect (#2070).
  # Pinned to upstream commit 978849b (post-1.4.1) which contains both.
  flutter_webrtc:
    git:
      url: https://github.com/flutter-webrtc/flutter-webrtc.git
      ref: 978849b90adfaa6d52381c82cf1fbd74ccf5731b

  media_kit:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: ./media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: ./libs/universal/media_kit_libs_video

  video_player_media_kit:
    git: 
      url: https://github.com/media-kit/media-kit.git
      ref: 652c49e02701bb6bb80953a6fdf650a5c8f002f9
      path: video_player_media_kit

  flutter_keyboard_visibility_web:
    git:
      url: https://github.com/raldhafiri/flutter_keyboard_visibility.git
      ref: master
      path: flutter_keyboard_visibility_web

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  custom_lint: ^0.8.1
  riverpod_generator: ^3.0.3
  riverpod_lint: ^3.0.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/images/icon.png"
  # Android adaptive icon (API 26+). Without these, only a legacy square icon is
  # generated, so launchers and the Android 12+ system splash wrap the mascot on
  # a white circle and shrink it ("small logo on white"). The foreground is a
  # pre-padded copy of the mascot sized into the adaptive-icon safe zone.
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/sdps/
    - assets/sfx/
