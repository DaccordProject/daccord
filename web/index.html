<!DOCTYPE html>
<html lang="en">

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A fast, cross-platform Flutter client for Daccord.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Daccord">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Daccord</title>
  <!-- <script src="enable-threads.js"></script> -->
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Public Sans', sans-serif;
      background-color: #14161A;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .loading-container {
      text-align: center;
      position: relative;
    }

    .welcome-text {
      font-size: 28px;
      margin-bottom: 10px;
      opacity: 0.9;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .app-name {
      font-size: 72px;
      font-weight: 600;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fireGradient 3s ease infinite;
    }

    .loading-text {
      font-size: 18px;
      margin-top: 30px;
      opacity: 0.7;
      font-weight: 300;
    }

    @keyframes fireGradient {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .complex-loader {
      width: 100px;
      height: 100px;
      position: relative;
      margin: 0 auto;
    }

    .complex-loader div {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #ff6b6b;
      border-radius: 50%;
      animation: spinnerOne 1.2s linear infinite;
    }

    .complex-loader div:nth-child(2) {
      border: 4px solid transparent;
      border-bottom-color: #feca57;
      animation: spinnerTwo 1.2s linear infinite;
    }

    .complex-loader div:nth-child(3) {
      border: 4px solid transparent;
      border-left-color: #ff9ff3;
      animation: spinnerThree 1.2s linear infinite;
    }

    @keyframes spinnerOne {
      0% {
        transform: rotate(0deg);
        border-width: 4px;
      }

      50% {
        transform: rotate(180deg);
        border-width: 1px;
      }

      100% {
        transform: rotate(360deg);
        border-width: 4px;
      }
    }

    @keyframes spinnerTwo {
      0% {
        transform: rotate(0deg);
        border-width: 1px;
      }

      50% {
        transform: rotate(180deg);
        border-width: 4px;
      }

      100% {
        transform: rotate(360deg);
        border-width: 1px;
      }
    }

    @keyframes spinnerThree {
      0% {
        transform: rotate(0deg);
        border-width: 2px;
      }

      50% {
        transform: rotate(180deg);
        border-width: 3px;
      }

      100% {
        transform: rotate(360deg);
        border-width: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="loading-container">
    <div class="welcome-text">Welcome to</div>
    <div class="app-name">Daccord</div>
    <div class="complex-loader">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="loading-text">Loading Daccord</div>
  </div>

  <script>
    // Service-worker update bridge (#91). Surfaces a newer deployed build to the
    // running tab so the app can offer a one-tap reload instead of relying on a
    // manual refresh. Read by lib/features/updates/services/web_update_web.dart.
    (function () {
      window.daccordUpdateAvailable = false;

      window.daccordApplyUpdate = function () {
        if (!('serviceWorker' in navigator)) {
          window.location.reload();
          return;
        }
        navigator.serviceWorker.getRegistration().then(function (reg) {
          // Best-effort: ask a waiting worker to take over immediately. The
          // default Flutter worker may ignore this, in which case the reload
          // (and eventually closing every tab) still activates the new build.
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          window.location.reload();
        }).catch(function () { window.location.reload(); });
      };

      if ('serviceWorker' in navigator) {
        var markAvailable = function () {
          window.daccordUpdateAvailable = true;
        };
        var watch = function (reg) {
          if (!reg) return;
          if (reg.waiting && navigator.serviceWorker.controller) markAvailable();
          reg.addEventListener('updatefound', function () {
            var installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' &&
                  navigator.serviceWorker.controller) {
                markAvailable();
              }
            });
          });
        };
        navigator.serviceWorker.ready.then(watch).catch(function () {});
        // Poll for a new deploy while the tab stays open (every 30 minutes).
        setInterval(function () {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.update().catch(function () {});
          }).catch(function () {});
        }, 1800000);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
