pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Flutter's DependencyVersionChecker (beta channel) errors below AGP 8.11.1 and
    // Kotlin 2.2.20, and warns below AGP 9.0.1 / Kotlin 2.3.20. Stay on the latest
    // AGP 8.x: AGP 9 reads only the new DSL, which the Flutter Gradle plugin (and
    // app/build.gradle) does not use yet.
    id "com.android.application" version "8.13.2" apply false
    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
}

include ":app"
